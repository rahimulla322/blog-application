<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            <h1>BlogSpace</h1>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main>

        <section class="login-container">

            <div class="login-box">

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Login to continue to BlogSpace
                </p>


                <!-- Login Form -->
                <form>

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Login Options -->
                    <div class="login-options">

                        <label>
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>


                <!-- Register Link -->
                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>

</body>

</html>
