<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Blog - BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <h1>BlogSpace</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-blog.html">Create Blog</a>
        <a href="login.html">Logout</a>
    </nav>

</header>


<main>

    <section class="dashboard">

        <div id="blog-view">

            <h2 id="view-title">Loading...</h2>

            <p>
                <strong>Category:</strong>
                <span id="view-category"></span>
            </p>

            <hr>

            <p id="view-content"></p>

            <br>

            <a href="dashboard.html" class="primary-btn">
                ← Back to Dashboard
            </a>

        </div>

    </section>

</main>


<footer>
    <p>© 2026 BlogSpace. All rights reserved.</p>
</footer>


<script>

    const params = new URLSearchParams(window.location.search);
    const blogId = params.get("id");

    const blogs = JSON.parse(localStorage.getItem("blogs")) || [];

    const blog = blogs.find(b => b.id == blogId);

    if (blog) {

        document.getElementById("view-title").textContent = blog.title;

        document.getElementById("view-category").textContent =
            blog.category || "Uncategorized";

        document.getElementById("view-content").textContent =
            blog.content;

    } else {

        document.getElementById("view-title").textContent =
            "Blog Not Found";

        document.getElementById("view-category").textContent = "";

        document.getElementById("view-content").textContent =
            "The requested blog could not be found.";

    }

</script>

</body>
</html>
