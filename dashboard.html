<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            <h1>BlogSpace</h1>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <!-- Dashboard -->
    <main>

        <section class="dashboard">

            <div class="dashboard-header">

                <div>
                    <h2>Welcome to your Dashboard</h2>

                    <p>
                        Manage your blogs and share your ideas with the world.
                    </p>
                </div>

                <a href="create-blog.html" class="primary-btn">
                    + Create Blog
                </a>

            </div>


            <!-- Statistics -->
            <div class="stats-container">

                <div class="stat-card">
                    <h3>0</h3>
                    <p>Total Blogs</p>
                </div>

                <div class="stat-card">
                    <h3>0</h3>
                    <p>Published</p>
                </div>

                <div class="stat-card">
                    <h3>0</h3>
                    <p>Drafts</p>
                </div>

            </div>


            <!-- My Blogs -->
            <section class="my-blogs">

                <h2>My Blogs</h2>

                <!-- JavaScript will insert blogs here -->
                <div class="blog-container"></div>

            </section>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
